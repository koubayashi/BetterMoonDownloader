[package]
name = "better-moon-downloader"
version = "1.0.0"
description = "BetterMoonDownloader: bulk downloader for fuckingfast.co and datanodes.to"
edition = "2021"
rust-version = "1.85"

[lib]
name = "bmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks", "http2"] }
chromiumoxide = { version = "0.9", default-features = false }
url = "2"
percent-encoding = "2"
regex = "1"
once_cell = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
window-vibrancy = "0.8"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
