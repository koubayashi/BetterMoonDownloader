# Builds the Linux packages (AppImage, .deb, .rpm).
# On a version tag (v*) they're attached to that tag's GitHub release.
# On any other push they're kept as workflow artifacts for testing.
name: Linux build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu, so the packages run on older distros too
    # (a binary needs a glibc at least as old as the one it was built on).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Build packages
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb,rpm

      - name: Smoke test (the app starts and stays up)
        working-directory: src-tauri
        run: |
          set +e
          HOME="$(mktemp -d)" timeout 20 xvfb-run -a dbus-run-session -- ./target/release/better-moon-downloader
          code=$?
          echo "exit code: $code"
          # 124 = still running when the timeout stopped it, which is what we want.
          test "$code" -eq 124

      - name: Collect packages
        run: |
          mkdir dist
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist/
          cd dist && sha256sum * > SHA256SUMS-linux.txt && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "BetterMoonDownloader ${GITHUB_REF_NAME#v}" --notes "See the README for install steps."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
